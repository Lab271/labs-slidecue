<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SlideCue Remote</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --border: #475569;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* PIN Entry Screen */
    #pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    }
    #pin-screen.hidden { display: none; }
    
    .pin-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 20rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
    }
    
    .pin-container h1 { 
      font-size: 1.5rem; 
      font-weight: 700;
      margin-bottom: 0.25rem; 
    }
    .pin-container p { 
      color: var(--text-secondary); 
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    
    .pin-inputs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .pin-inputs input {
      width: 3rem;
      height: 3.5rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 0.625rem;
      outline: none;
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .pin-inputs input:focus { 
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    
    .error { 
      color: #ef4444; 
      margin-bottom: 0.75rem; 
      min-height: 1.25rem; 
      font-size: 0.8125rem;
    }
    
    .btn {
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { 
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      color: white; 
    }
    .btn-primary:disabled { 
      opacity: 0.5; 
      cursor: not-allowed;
    }
    
    /* Remote Control Screen */
    #remote-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-primary);
      overflow: hidden;
    }
    #remote-screen.active { display: flex; }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .header-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
    }
    
    .header-timer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .timer-elapsed {
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.875rem;
    }
    
    .timer-clock {
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .slide-badge {
      background: var(--accent);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 0.875rem;
    }
    
    .animation-badge {
      background: var(--bg-card);
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
    }
    
    /* Main content - 2x2 grid layout */
    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0.5rem;
      padding: 0.5rem;
      overflow: hidden;
      min-height: 0;
    }
    
    /* Current slide preview - spans both columns */
    .current-slide-area {
      grid-column: 1 / -1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    
    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.375rem 0.75rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .slide-label {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    
    .slide-number {
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--accent);
    }
    
    /* Slide preview */
    .slide-preview {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }
    
    .slide-preview img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .slide-preview .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    
    .placeholder-text {
      font-size: 0.75rem;
    }
    
    /* Notes section - bottom left */
    .notes-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    
    .notes-header {
      display: flex;
      align-items: center;
      padding: 0.375rem 0.75rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .notes-label {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    
    .notes-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.75rem;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }
    
    .notes-content.empty {
      font-style: italic;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Next slide section - bottom right */
    .next-slide-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--success);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    
    .next-slide-area .slide-header {
      border-bottom-color: var(--border);
    }
    
    .next-slide-area .slide-label {
      color: var(--success);
    }
    
    .next-slide-area .slide-number {
      color: var(--success);
    }
    
    .next-slide-preview {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    
    .next-slide-preview img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .next-slide-preview .placeholder {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    
    /* End state - bottom right */
    .end-state-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary);
      border: 1px solid var(--success);
      border-radius: 0.75rem;
      padding: 1rem;
      text-align: center;
    }
    
    .end-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .end-title {
      font-size: 1rem;
      font-weight: 600;
    }
    
    .end-subtitle {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    
    /* Navigation */
    .nav-section {
      padding: 0.75rem;
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .nav-btn {
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    
    .nav-btn:disabled { 
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .nav-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    
    .btn-prev { 
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    
    .btn-next { 
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      color: white;
    }
    
    .nav-icon {
      font-size: 1.25rem;
    }
    
    .btn-overview {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.75rem;
      font-size: 0.875rem;
    }
    
    /* Mobile responsive */
    @media (max-width: 480px) {
      .header-title {
        font-size: 0.875rem;
      }
      
      .timer-elapsed {
        font-size: 0.75rem;
      }
      
      .timer-clock {
        display: none;
      }
      
      .notes-content {
        font-size: 0.875rem;
        padding: 0.5rem;
      }
    }
    
    /* Slide Overview Modal */
    .overview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
      flex-direction: column;
    }
    .overview-modal.active {
      display: flex;
    }
    
    .overview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .overview-title {
      font-weight: 600;
      font-size: 1rem;
    }
    
    .overview-close {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .overview-grid {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0.75rem;
      display: flex;
      flex-direction: row;
      gap: 0.5rem;
      align-items: center;
    }
    
    .overview-slide {
      flex-shrink: 0;
      width: 160px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .overview-slide:active {
      transform: scale(0.97);
    }
    
    .overview-slide.current {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    
    .overview-slide-preview {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
    }
    
    .overview-slide-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .overview-slide-preview .placeholder {
      color: var(--text-muted);
      font-size: 1.5rem;
    }
    
    .overview-slide-num {
      padding: 0.375rem 0.5rem;
      background: var(--bg-card);
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-secondary);
    }
    
    .overview-slide.current .overview-slide-num {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <!-- PIN Entry Screen -->
  <div id="pin-screen">
    <div class="pin-container">
      <img src="/icon.png" alt="SlideCue" class="logo" />
      <h1>SlideCue</h1>
      <p>Enter the 4-digit PIN to connect</p>
      <div class="pin-inputs">
        <input type="text" inputmode="numeric" maxlength="1" data-index="0" autofocus />
        <input type="text" inputmode="numeric" maxlength="1" data-index="1" />
        <input type="text" inputmode="numeric" maxlength="1" data-index="2" />
        <input type="text" inputmode="numeric" maxlength="1" data-index="3" />
      </div>
      <div class="error" id="error"></div>
      <button class="btn btn-primary" id="connect-btn" disabled>Connect</button>
    </div>
  </div>
  
  <!-- Remote Control Screen -->
  <div id="remote-screen">
    <div class="header">
      <div class="header-left">
        <span class="header-title">SlideCue</span>
        <div class="header-timer">
          <span class="timer-elapsed" id="timer-elapsed">00:00</span>
          <span>•</span>
          <span class="timer-clock" id="timer-clock">--:--</span>
        </div>
      </div>
      <div class="header-right">
        <span class="slide-badge" id="slide-counter">1 / 1</span>
        <span class="animation-badge" id="animation-badge" style="display:none;">0/0</span>
      </div>
    </div>
    
    <div class="main-content">
      <!-- Current Slide - Top (spans both columns) -->
      <div class="current-slide-area">
        <div class="slide-header">
          <span class="slide-label">Current Slide</span>
          <span class="slide-number" id="current-slide-num">1</span>
        </div>
        <div class="slide-preview" id="current-preview">
          <img id="current-img" src="" alt="Current slide" style="display:none;" />
          <div class="placeholder" id="current-placeholder">
            <div class="placeholder-text">Loading...</div>
          </div>
        </div>
      </div>
      
      <!-- Speaker Notes - Bottom Left -->
      <div class="notes-area">
        <div class="notes-header">
          <span class="notes-label">Speaker Notes</span>
        </div>
        <div class="notes-content" id="current-notes">No notes</div>
      </div>
      
      <!-- Next Slide - Bottom Right -->
      <div class="next-slide-area" id="next-area">
        <div class="slide-header">
          <span class="slide-label">Up Next</span>
          <span class="slide-number" id="next-slide-num">2</span>
        </div>
        <div class="next-slide-preview" id="next-preview">
          <img id="next-img" src="" alt="Next slide" style="display:none;" />
          <div class="placeholder" id="next-placeholder">
            <span class="placeholder-text">Loading</span>
          </div>
        </div>
      </div>
      
      <!-- End State - Bottom Right (hidden by default) -->
      <div class="end-state-area" id="end-area" style="display:none;">
        <div class="end-icon">✓</div>
        <div class="end-title">Last Slide</div>
        <div class="end-subtitle">You've reached the end</div>
      </div>
    </div>
    
    <div class="nav-section">
      <div class="nav-buttons">
        <button class="nav-btn btn-prev" id="prev-btn">
          <span class="nav-icon">←</span>
          <span>Previous</span>
        </button>
        <button class="nav-btn btn-next" id="next-btn">
          <span>Next</span>
          <span class="nav-icon">→</span>
        </button>
      </div>
      <button class="nav-btn btn-overview" id="overview-btn">
        <span>Go to Slide</span>
      </button>
    </div>
  </div>
  
  <!-- Slide Overview Modal -->
  <div class="overview-modal" id="overview-modal">
    <div class="overview-header">
      <span class="overview-title">Go to Slide</span>
      <button class="overview-close" id="overview-close">Close</button>
    </div>
    <div class="overview-grid" id="overview-grid">
      <!-- Slides will be populated dynamically -->
    </div>
  </div>

  <script>
    const pinScreen = document.getElementById('pin-screen');
    const remoteScreen = document.getElementById('remote-screen');
    const pinInputs = document.querySelectorAll('.pin-inputs input');
    const connectBtn = document.getElementById('connect-btn');
    const errorEl = document.getElementById('error');
    
    const slideCounter = document.getElementById('slide-counter');
    const animationBadge = document.getElementById('animation-badge');
    const currentSlideNum = document.getElementById('current-slide-num');
    const nextSlideNum = document.getElementById('next-slide-num');
    
    const currentImg = document.getElementById('current-img');
    const currentPlaceholder = document.getElementById('current-placeholder');
    const currentNotes = document.getElementById('current-notes');
    
    const nextArea = document.getElementById('next-area');
    const nextImg = document.getElementById('next-img');
    const nextPlaceholder = document.getElementById('next-placeholder');
    const endArea = document.getElementById('end-area');
    
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const overviewBtn = document.getElementById('overview-btn');
    const overviewModal = document.getElementById('overview-modal');
    const overviewClose = document.getElementById('overview-close');
    const overviewGrid = document.getElementById('overview-grid');
    
    let socket = null;
    let slideInfo = { 
      currentSlide: 1, 
      totalSlides: 1, 
      animationStep: 0, 
      animationsOnSlide: 0, 
      nextVisibleSlide: 2, 
      isLastSlide: false,
      currentNotes: '',
      nextNotes: ''
    };
    
    // PIN input handling
    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value.replace(/\D/g, '');
        e.target.value = value;
        if (value && index < 3) {
          pinInputs[index + 1].focus();
        }
        updateConnectButton();
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          pinInputs[index - 1].focus();
        }
        if (e.key === 'Enter' && getPin().length === 4) {
          connect();
        }
      });
    });
    
    function getPin() {
      return Array.from(pinInputs).map(i => i.value).join('');
    }
    
    function updateConnectButton() {
      connectBtn.disabled = getPin().length !== 4;
    }
    
    connectBtn.addEventListener('click', connect);
    
    function connect() {
      const pin = getPin();
      if (pin.length !== 4) return;
      
      errorEl.textContent = '';
      connectBtn.disabled = true;
      connectBtn.textContent = 'Connecting...';
      
      socket = io(window.location.origin, {
        auth: { pin }
      });
      
      socket.on('connect', () => {
        pinScreen.classList.add('hidden');
        remoteScreen.classList.add('active');
        startTimer();
      });
      
      socket.on('connect_error', () => {
        errorEl.textContent = 'Invalid PIN. Please try again.';
        connectBtn.disabled = false;
        connectBtn.textContent = 'Connect';
        socket.close();
        socket = null;
      });
      
      socket.on('slide-changed', (info) => {
        slideInfo = info;
        updateUI();
      });
      
      socket.on('disconnect', () => {
        errorEl.textContent = 'Connection lost. Please reconnect.';
        pinScreen.classList.remove('hidden');
        remoteScreen.classList.remove('active');
        connectBtn.disabled = false;
        connectBtn.textContent = 'Connect';
      });
    }
    
    function loadImage(imgEl, placeholderEl, slideNum, fallbackText) {
      if (!slideNum) {
        imgEl.style.display = 'none';
        placeholderEl.style.display = 'flex';
        placeholderEl.innerHTML = `
          <div class="placeholder-text">${fallbackText}</div>
        `;
        return;
      }
      
      const imgUrl = `/thumbnails/slide_${String(slideNum).padStart(3, '0')}.png?t=${Date.now()}`;
      imgEl.onload = () => {
        imgEl.style.display = 'block';
        placeholderEl.style.display = 'none';
      };
      imgEl.onerror = () => {
        imgEl.style.display = 'none';
        placeholderEl.style.display = 'flex';
        placeholderEl.innerHTML = `
          <div class="placeholder-text">Hidden</div>
        `;
      };
      imgEl.src = imgUrl;
    }
    
    function updateUI() {
      // Update header
      slideCounter.textContent = `${slideInfo.currentSlide} / ${slideInfo.totalSlides}`;
      
      // Animation badge
      if (slideInfo.animationsOnSlide > 0) {
        animationBadge.style.display = 'inline';
        animationBadge.textContent = `${slideInfo.animationStep}/${slideInfo.animationsOnSlide}`;
      } else {
        animationBadge.style.display = 'none';
      }
      
      // Current slide
      currentSlideNum.textContent = slideInfo.currentSlide;
      loadImage(currentImg, currentPlaceholder, slideInfo.currentSlide, 'Loading');
      
      // Current notes
      if (slideInfo.currentNotes && slideInfo.currentNotes.trim()) {
        currentNotes.textContent = slideInfo.currentNotes;
        currentNotes.classList.remove('empty');
      } else {
        currentNotes.textContent = 'No speaker notes';
        currentNotes.classList.add('empty');
      }
      
      // Next slide / End state
      if (slideInfo.isLastSlide) {
        nextArea.style.display = 'none';
        endArea.style.display = 'flex';
      } else {
        nextArea.style.display = 'flex';
        endArea.style.display = 'none';
        
        nextSlideNum.textContent = slideInfo.nextVisibleSlide || '—';
        loadImage(nextImg, nextPlaceholder, slideInfo.nextVisibleSlide, 'None');
      }
      
      // Button states
      prevBtn.disabled = slideInfo.currentSlide <= 1 && slideInfo.animationStep === 0;
      nextBtn.disabled = slideInfo.isLastSlide && slideInfo.animationStep >= slideInfo.animationsOnSlide;
    }
    
    // Vibration feedback helper
    function vibrate(pattern = 10) {
      if ('vibrate' in navigator) {
        navigator.vibrate(pattern);
      }
    }
    
    prevBtn.addEventListener('click', () => {
      vibrate();
      socket?.emit('prev');
    });
    
    nextBtn.addEventListener('click', () => {
      vibrate();
      socket?.emit('next');
    });
    
    // Overview modal
    function buildOverviewGrid() {
      overviewGrid.innerHTML = '';
      
      for (let i = 1; i <= slideInfo.totalSlides; i++) {
        const slideEl = document.createElement('div');
        slideEl.className = 'overview-slide' + (i === slideInfo.currentSlide ? ' current' : '');
        slideEl.innerHTML = `
          <div class="overview-slide-preview">
            <img src="/thumbnails/slide_${String(i).padStart(3, '0')}.png" 
                 alt="Slide ${i}" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <div class="placeholder" style="display:none;">Hidden</div>
          </div>
          <div class="overview-slide-num">Slide ${i}</div>
        `;
        slideEl.addEventListener('click', () => {
          vibrate(15);
          socket?.emit('goto', i);
          overviewModal.classList.remove('active');
        });
        overviewGrid.appendChild(slideEl);
      }
    }
    
    function openOverview() {
      buildOverviewGrid();
      overviewModal.classList.add('active');
      
      // Scroll to current slide
      setTimeout(() => {
        const currentSlideEl = overviewGrid.querySelector('.overview-slide.current');
        if (currentSlideEl) {
          currentSlideEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'center' });
        }
      }, 50);
    }
    
    function closeOverview() {
      overviewModal.classList.remove('active');
    }
    
    overviewBtn.addEventListener('click', () => {
      vibrate();
      openOverview();
    });
    overviewClose.addEventListener('click', () => {
      vibrate();
      closeOverview();
    });
    
    // Close on escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overviewModal.classList.contains('active')) {
        closeOverview();
      }
    });
    
    // Timer functionality
    let startTime = null;
    const timerElapsed = document.getElementById('timer-elapsed');
    const timerClock = document.getElementById('timer-clock');
    
    function formatTime(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      if (hrs > 0) {
        return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    
    function updateTimers() {
      // Current time
      const now = new Date();
      timerClock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      // Elapsed time
      if (startTime) {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        timerElapsed.textContent = formatTime(elapsed);
      }
    }
    
    // Start timer when connected
    function startTimer() {
      startTime = Date.now();
      updateTimers();
      setInterval(updateTimers, 1000);
    }
    
    // Update clock immediately
    updateTimers();
    setInterval(() => {
      if (!startTime) updateTimers();
    }, 1000);
    
    // Auto-login if PIN is in URL
    (function checkAutoLogin() {
      const params = new URLSearchParams(window.location.search);
      const pinParam = params.get('pin');
      if (pinParam && pinParam.length === 4 && /^\d{4}$/.test(pinParam)) {
        // Fill in PIN inputs
        pinParam.split('').forEach((digit, i) => {
          pinInputs[i].value = digit;
        });
        // Auto-connect after a short delay
        setTimeout(() => {
          connect();
        }, 300);
      }
    })();
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (!socket || pinScreen.classList.contains('hidden') === false) return;
      if (overviewModal.classList.contains('active')) return; // Don't navigate when overview is open
      
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        socket.emit('next');
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        socket.emit('prev');
      } else if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        openOverview();
      }
    });
  </script>
</body>
</html>
