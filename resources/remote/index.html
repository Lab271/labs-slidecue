<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SlideCue Remote</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --border: #475569;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* PIN Entry Screen */
    #pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    }
    #pin-screen.hidden { display: none; }
    
    .pin-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 20rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      border-radius: 0.875rem;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    
    .pin-container h1 { 
      font-size: 1.5rem; 
      font-weight: 700;
      margin-bottom: 0.25rem; 
    }
    .pin-container p { 
      color: var(--text-secondary); 
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    
    .pin-inputs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .pin-inputs input {
      width: 3rem;
      height: 3.5rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 0.625rem;
      outline: none;
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .pin-inputs input:focus { 
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    
    .error { 
      color: #ef4444; 
      margin-bottom: 0.75rem; 
      min-height: 1.25rem; 
      font-size: 0.8125rem;
    }
    
    .btn {
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { 
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      color: white; 
    }
    .btn-primary:disabled { 
      opacity: 0.5; 
      cursor: not-allowed;
    }
    
    /* Remote Control Screen - optimized for iPhone */
    #remote-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-primary);
      overflow: hidden;
    }
    #remote-screen.active { display: flex; }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .header-title {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    
    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    
    .slide-badge {
      background: var(--accent);
      color: white;
      padding: 0.25rem 0.625rem;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 0.8125rem;
    }
    
    .animation-badge {
      background: var(--bg-card);
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.6875rem;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      gap: 0.5rem;
      overflow: hidden;
      min-height: 0;
    }
    
    .slides-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    
    .slide-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      overflow: hidden;
    }
    
    .slide-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.375rem 0.5rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    
    .slide-card-label {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    
    .next-card .slide-card-label {
      color: var(--success);
    }
    
    .slide-card-number {
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--accent);
    }
    
    .slide-preview {
      aspect-ratio: 16/9;
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .slide-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .slide-preview .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    
    .placeholder-icon {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    
    .placeholder-text {
      font-size: 0.625rem;
    }
    
    /* Notes section - takes remaining space */
    .notes-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 0;
      overflow: hidden;
    }
    
    .notes-card {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    
    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.375rem 0.625rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .notes-label {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    
    .notes-label.next {
      color: var(--success);
    }
    
    .notes-content-wrapper {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .notes-content {
      padding: 0.5rem 0.625rem;
      font-size: 0.8125rem;
      line-height: 1.4;
      color: var(--text-secondary);
    }
    
    .notes-content.empty {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    
    .nav-section {
      padding: 0.5rem;
      padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    
    .nav-btn {
      padding: 1rem;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    
    .nav-btn:disabled { 
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .nav-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    
    .btn-prev { 
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    
    .btn-next { 
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      color: white;
    }
    
    .nav-icon {
      font-size: 1.125rem;
    }
    
    /* End state */
    .end-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      text-align: center;
      padding: 1rem;
    }
    
    .end-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
      border-radius: 50%;
      margin: 0 auto 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    
    .end-title {
      font-size: 0.875rem;
      font-weight: 600;
    }
    
    .end-subtitle {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <!-- PIN Entry Screen -->
  <div id="pin-screen">
    <div class="pin-container">
      <div class="logo">📊</div>
      <h1>SlideCue</h1>
      <p>Enter the 4-digit PIN to connect</p>
      <div class="pin-inputs">
        <input type="text" inputmode="numeric" maxlength="1" data-index="0" autofocus />
        <input type="text" inputmode="numeric" maxlength="1" data-index="1" />
        <input type="text" inputmode="numeric" maxlength="1" data-index="2" />
        <input type="text" inputmode="numeric" maxlength="1" data-index="3" />
      </div>
      <div class="error" id="error"></div>
      <button class="btn btn-primary" id="connect-btn" disabled>Connect</button>
    </div>
  </div>
  
  <!-- Remote Control Screen -->
  <div id="remote-screen">
    <div class="header">
      <span class="header-title">SlideCue</span>
      <div class="header-badges">
        <span class="slide-badge" id="slide-counter">1 / 1</span>
        <span class="animation-badge" id="animation-badge" style="display:none;">⚡ 0/0</span>
      </div>
    </div>
    
    <div class="main-content">
      <!-- Side by side slide previews -->
      <div class="slides-row">
        <!-- Current Slide -->
        <div class="slide-card current-card">
          <div class="slide-card-header">
            <span class="slide-card-label">Current</span>
            <span class="slide-card-number" id="current-slide-num">1</span>
          </div>
          <div class="slide-preview" id="current-preview">
            <img id="current-img" src="" alt="Current" style="display:none;" />
            <div class="placeholder" id="current-placeholder">
              <div class="placeholder-icon">📄</div>
              <div class="placeholder-text">Loading</div>
            </div>
          </div>
        </div>
        
        <!-- Next Slide -->
        <div class="slide-card next-card" id="next-card">
          <div class="slide-card-header">
            <span class="slide-card-label">Up Next</span>
            <span class="slide-card-number" id="next-slide-num">2</span>
          </div>
          <div class="slide-preview" id="next-preview">
            <img id="next-img" src="" alt="Next" style="display:none;" />
            <div class="placeholder" id="next-placeholder">
              <div class="placeholder-icon">📄</div>
              <div class="placeholder-text">Loading</div>
            </div>
          </div>
        </div>
        
        <!-- End card (hidden by default) -->
        <div class="slide-card next-card end-card" id="end-card" style="display:none;">
          <div class="slide-card-header">
            <span class="slide-card-label">Done</span>
            <span class="slide-card-number">✓</span>
          </div>
          <div class="slide-preview">
            <div class="placeholder">
              <div class="placeholder-icon">🎉</div>
              <div class="placeholder-text">End</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Notes section -->
      <div class="notes-container">
        <!-- Current slide notes -->
        <div class="notes-card">
          <div class="notes-header">
            <span class="notes-label">📝 Current Slide Notes</span>
          </div>
          <div class="notes-content-wrapper">
            <div class="notes-content" id="current-notes">No notes</div>
          </div>
        </div>
        
        <!-- Next slide notes -->
        <div class="notes-card" id="next-notes-card">
          <div class="notes-header">
            <span class="notes-label next">➡️ Next Slide Notes</span>
          </div>
          <div class="notes-content-wrapper">
            <div class="notes-content" id="next-notes">No notes</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="nav-section">
      <div class="nav-buttons">
        <button class="nav-btn btn-prev" id="prev-btn">
          <span class="nav-icon">←</span>
          <span>Prev</span>
        </button>
        <button class="nav-btn btn-next" id="next-btn">
          <span>Next</span>
          <span class="nav-icon">→</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const pinScreen = document.getElementById('pin-screen');
    const remoteScreen = document.getElementById('remote-screen');
    const pinInputs = document.querySelectorAll('.pin-inputs input');
    const connectBtn = document.getElementById('connect-btn');
    const errorEl = document.getElementById('error');
    
    const slideCounter = document.getElementById('slide-counter');
    const animationBadge = document.getElementById('animation-badge');
    const currentSlideNum = document.getElementById('current-slide-num');
    const nextSlideNum = document.getElementById('next-slide-num');
    
    const currentImg = document.getElementById('current-img');
    const currentPlaceholder = document.getElementById('current-placeholder');
    const currentNotes = document.getElementById('current-notes');
    
    const nextCard = document.getElementById('next-card');
    const nextImg = document.getElementById('next-img');
    const nextPlaceholder = document.getElementById('next-placeholder');
    const nextNotes = document.getElementById('next-notes');
    const nextNotesCard = document.getElementById('next-notes-card');
    const endCard = document.getElementById('end-card');
    
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    
    let socket = null;
    let slideInfo = { 
      currentSlide: 1, 
      totalSlides: 1, 
      animationStep: 0, 
      animationsOnSlide: 0, 
      nextVisibleSlide: 2, 
      isLastSlide: false,
      currentNotes: '',
      nextNotes: ''
    };
    
    // PIN input handling
    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value.replace(/\D/g, '');
        e.target.value = value;
        if (value && index < 3) {
          pinInputs[index + 1].focus();
        }
        updateConnectButton();
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          pinInputs[index - 1].focus();
        }
        if (e.key === 'Enter' && getPin().length === 4) {
          connect();
        }
      });
    });
    
    function getPin() {
      return Array.from(pinInputs).map(i => i.value).join('');
    }
    
    function updateConnectButton() {
      connectBtn.disabled = getPin().length !== 4;
    }
    
    connectBtn.addEventListener('click', connect);
    
    function connect() {
      const pin = getPin();
      if (pin.length !== 4) return;
      
      errorEl.textContent = '';
      connectBtn.disabled = true;
      connectBtn.textContent = 'Connecting...';
      
      socket = io(window.location.origin, {
        auth: { pin }
      });
      
      socket.on('connect', () => {
        pinScreen.classList.add('hidden');
        remoteScreen.classList.add('active');
      });
      
      socket.on('connect_error', () => {
        errorEl.textContent = 'Invalid PIN. Please try again.';
        connectBtn.disabled = false;
        connectBtn.textContent = 'Connect';
        socket.close();
        socket = null;
      });
      
      socket.on('slide-changed', (info) => {
        slideInfo = info;
        updateUI();
      });
      
      socket.on('disconnect', () => {
        errorEl.textContent = 'Connection lost. Please reconnect.';
        pinScreen.classList.remove('hidden');
        remoteScreen.classList.remove('active');
        connectBtn.disabled = false;
        connectBtn.textContent = 'Connect';
      });
    }
    
    function loadImage(imgEl, placeholderEl, slideNum, fallbackText) {
      if (!slideNum) {
        imgEl.style.display = 'none';
        placeholderEl.style.display = 'flex';
        placeholderEl.innerHTML = `
          <div class="placeholder-icon">📄</div>
          <div class="placeholder-text">${fallbackText}</div>
        `;
        return;
      }
      
      const imgUrl = `/thumbnails/slide_${String(slideNum).padStart(3, '0')}.png?t=${Date.now()}`;
      imgEl.onload = () => {
        imgEl.style.display = 'block';
        placeholderEl.style.display = 'none';
      };
      imgEl.onerror = () => {
        imgEl.style.display = 'none';
        placeholderEl.style.display = 'flex';
        placeholderEl.innerHTML = `
          <div class="placeholder-icon">🔒</div>
          <div class="placeholder-text">Hidden Slide ${slideNum}</div>
        `;
      };
      imgEl.src = imgUrl;
    }
    
    function updateUI() {
      // Update header
      slideCounter.textContent = `${slideInfo.currentSlide} / ${slideInfo.totalSlides}`;
      
      // Animation badge
      if (slideInfo.animationsOnSlide > 0) {
        animationBadge.style.display = 'inline';
        animationBadge.textContent = `⚡ ${slideInfo.animationStep}/${slideInfo.animationsOnSlide}`;
      } else {
        animationBadge.style.display = 'none';
      }
      
      // Current slide
      currentSlideNum.textContent = slideInfo.currentSlide;
      loadImage(currentImg, currentPlaceholder, slideInfo.currentSlide, 'Loading');
      
      // Current notes
      if (slideInfo.currentNotes && slideInfo.currentNotes.trim()) {
        currentNotes.textContent = slideInfo.currentNotes;
        currentNotes.classList.remove('empty');
      } else {
        currentNotes.textContent = 'No speaker notes';
        currentNotes.classList.add('empty');
      }
      
      // Next slide / End state
      if (slideInfo.isLastSlide) {
        nextCard.style.display = 'none';
        endCard.style.display = 'block';
        nextNotesCard.style.display = 'none';
      } else {
        nextCard.style.display = 'block';
        endCard.style.display = 'none';
        nextNotesCard.style.display = 'flex';
        
        nextSlideNum.textContent = slideInfo.nextVisibleSlide || '—';
        loadImage(nextImg, nextPlaceholder, slideInfo.nextVisibleSlide, 'None');
        
        // Next notes
        if (slideInfo.nextNotes && slideInfo.nextNotes.trim()) {
          nextNotes.textContent = slideInfo.nextNotes;
          nextNotes.classList.remove('empty');
        } else {
          nextNotes.textContent = 'No speaker notes';
          nextNotes.classList.add('empty');
        }
      }
      
      // Button states
      prevBtn.disabled = slideInfo.currentSlide <= 1 && slideInfo.animationStep === 0;
      nextBtn.disabled = slideInfo.isLastSlide && slideInfo.animationStep >= slideInfo.animationsOnSlide;
    }
    
    prevBtn.addEventListener('click', () => socket?.emit('prev'));
    nextBtn.addEventListener('click', () => socket?.emit('next'));
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (!socket || pinScreen.classList.contains('hidden') === false) return;
      
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        socket.emit('next');
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        socket.emit('prev');
      }
    });
  </script>
</body>
</html>
