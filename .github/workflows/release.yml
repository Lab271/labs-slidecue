name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Make
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: out/make/*.dmg

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: out/make/zip/**/*.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Make
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: out/make/squirrel.windows/x64/*.exe

      - name: Upload RELEASES artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: out/make/squirrel.windows/x64/RELEASES

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nupkg
          path: out/make/squirrel.windows/x64/*.nupkg

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./dist/mac

      - name: Download macOS ZIP
        uses: actions/download-artifact@v4
        with:
          name: macos-zip
          path: ./dist/mac

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: ./dist/win

      - name: Download Windows RELEASES
        uses: actions/download-artifact@v4
        with:
          name: windows-releases
          path: ./dist/win

      - name: Download Windows nupkg
        uses: actions/download-artifact@v4
        with:
          name: windows-nupkg
          path: ./dist/win

      - name: List files
        run: find ./dist -type f

      - name: Create Release in source repo
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/mac/*.dmg
            ./dist/mac/*.zip
            ./dist/win/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also publish to the PUBLIC releases repo for auto-updates
      # This allows the auto-updater to work without exposing source code
      - name: Create Release in public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: LAB271/SlideCue-releases
          tag_name: ${{ github.ref_name }}
          name: SlideCue ${{ github.ref_name }}
          files: |
            ./dist/mac/*.dmg
            ./dist/mac/*.zip
            ./dist/win/*.exe
            ./dist/win/RELEASES
            ./dist/win/*.nupkg
        env:
          # Create a PAT with 'repo' scope and add as RELEASES_REPO_TOKEN secret
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
