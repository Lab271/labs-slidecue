# A public repo publishes its dependency tree, so a known-vulnerable pin is
# visible to everyone - keep the updates flowing.
#
# `cooldown` waits out a freshly published version, which is the cheap mitigation
# for a compromised release being pulled straight into a PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Without grouping, dependabot raises one PR per package, and a package
    # whose peers are pinned to a sibling's major can never resolve alone - the
    # PR dies at `npm ci` with ERESOLVE before a single test runs. That is what
    # happened to #47, #49, #50 and #51: four separate PRs, four peer conflicts,
    # zero of them fixable in isolation. #49 and #50 are the clearest case - one
    # bumps vite to 8, the other bumps @vitejs/plugin-react to a version
    # requiring vite 8, and each fails precisely because the other is a separate
    # PR. The groups below exist so those arrive as one resolvable change.
    groups:
      # eslint majors drop APIs its plugins compile against, and
      # @typescript-eslint peers both eslint *and* typescript, which is why
      # typescript rides along here rather than in a group of its own.
      lint-and-types:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "typescript"
        update-types: ["major", "minor", "patch"]
      # vite's major is a peer of every plugin in the build, electron-vite
      # included - and electron-vite is usually the last to support a new one,
      # so this group will sit still until it does. That is the correct
      # behaviour: one PR that waits, rather than several that fail.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "electron-vite"
        update-types: ["major", "minor", "patch"]
      # react and react-dom are released in lockstep and their @types follow the
      # same major.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["major", "minor", "patch"]

    # Grouping typescript with the eslint tooling was right - @typescript-eslint
    # peers both - but it turned a red *PR* into a red dependabot *job*. The
    # updater cannot build a resolvable lockfile for typescript 7 while
    # @typescript-eslint peers `>=4.8.4 <6.1.0`, so it aborts the dependency
    # with `dependency_file_not_resolvable: "Error while updating peer
    # dependency."` and the whole run fails - four times in one evening. The
    # group PR is still produced (#65 came out of one of those "failed" runs),
    # so the only real cost is a permanently red job that would mask a genuine
    # dependabot failure later.
    #
    # Ignoring the major stops dependabot attempting something that cannot
    # succeed. It does not freeze typescript: 5.x minor and patch updates still
    # flow, and they still travel in the lint-and-types group. Lift this the
    # moment typescript-eslint widens its peer range - at which point the
    # grouping does exactly what it was added for and bumps both together.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
